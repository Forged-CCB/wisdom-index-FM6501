<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge and Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  everyday working tool for a teacher, calm and sturdy
   IDEA   a workbench: the lesson as blocks laid out on the bench, seams between them to finish
   PICTURE the block stack itself, with its trouble/grace edges and seam slots, is the picture
   COLOUR white bench, iron ink, wheat header band, ember accent for the big idea and open seams, sage for grace
   TYPE   Archivo 800 display + Source Sans 3
   LAYOUT top bar + tabs; Build = blocks left, idea panel right (stacks under 900px) */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141518);--ink:light-dark(#1c1d21,#ecebe6);--mute:light-dark(#5b5d63,#a7a8a3);--line:light-dark(#e3e1da,#30323a);--panel:light-dark(#f6f4ee,#1c1e22);--ember:light-dark(#c9411a,#f0683c);--wheat:light-dark(#ecdcae,#3a3322);--sage:light-dark(#6f8a5a,#8fae78);--tr:light-dark(#e09474,#c4704f);--gr:light-dark(#9fbe88,#7fa067)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:24px;margin-bottom:12px}
h3{font-size:17px;margin-bottom:8px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.45;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:0 0 4px}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#fff}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.ai::before{content:"✦ ";color:var(--ember)}
.btn.pri.ai::before{color:#fff}
.top{background:var(--wheat);padding:10px max(3vw,16px);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:20px;margin-right:6px;white-space:nowrap}
.top select{width:auto;max-width:min(52vw,340px);background:var(--bg)}
.stat{margin-left:auto;font-size:13px;color:var(--mute)}
.slist{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:4px}
.slist button{width:100%;display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;min-height:44px;padding:6px 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.slist button[aria-current=true]{border-color:var(--ember);box-shadow:inset 4px 0 0 var(--ember)}
.slist .pn{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.slist .dt{font-size:14px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 max(3vw,16px);border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tabs button{flex:none;min-height:46px;padding:0 14px;border:0;background:none;font-weight:700;border-bottom:3px solid transparent;cursor:pointer;color:var(--mute)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ember)}
@media(min-width:900px){.tabs{position:sticky;top:0;z-index:4}}
main{padding:20px max(3vw,16px) 60px;max-width:1240px;margin:0 auto}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.f{margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.note{font-size:14px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.build{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.side{position:sticky;top:60px;display:grid;gap:14px}
.blk{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:10px 12px 12px 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px}
.blk.trouble{border-left-color:var(--tr)}.blk.grace{border-left-color:var(--gr)}.blk.big{border-left-color:var(--ember)}
.blk.sec{background:var(--wheat);border-color:var(--wheat)}
.blk.drag{opacity:.4}
.blk.above{box-shadow:0 -4px 0 var(--ember)}.blk.below{box-shadow:0 4px 0 var(--ember)}
.grip{grid-row:span 3;width:36px;min-height:44px;border:0;background:none;color:var(--mute);font-size:20px;cursor:grab;touch-action:none;border-radius:6px}
.bh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bh select{width:auto;padding:4px 6px;font-size:14px;min-height:36px}
.bh .sp{flex:1}
.bt{font-weight:700;font-size:17px}
.sec .bt{font-family:Archivo,sans-serif;font-size:19px;background:transparent;border-color:transparent}
.ib{width:36px;min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer}
.seam{margin:4px 0 4px 26px;padding:6px 0 6px 14px;border-left:2px dashed var(--line)}

.idea{font-family:Archivo,sans-serif;font-size:18px;line-height:1.25;padding:10px 12px;border-left:4px solid var(--ember);background:var(--bg);border-radius:6px}
.sugg{display:grid;gap:6px;margin-top:8px}
.sg{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
.phases{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.phases li{display:grid;grid-template-columns:44px 7.5em minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.phases input{width:22px;height:22px;margin:0 auto}
.phases .d{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 12px;border:0;background:var(--bg);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.prev{background:#fff;color:#1c1d21;border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,36px);max-height:70vh;overflow:auto}
.prev h1{font-size:28px;margin-bottom:4px}.prev h2{font-size:21px;margin:22px 0 6px}.prev h3{font-size:16px;margin:16px 0 4px}
.prev .t{color:#6a4a3a;font-style:italic;border-left:3px solid #e09474;padding-left:10px;margin:10px 0}
.prev .bi{font-family:Archivo,sans-serif;font-size:18px;border-left:4px solid #c9411a;padding-left:10px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.empty{padding:30px;text-align:center;border:2px dashed var(--line);border-radius:10px;color:var(--mute)}
body.dragging{user-select:none;cursor:grabbing}
main.wide{max-width:none;padding:0}
.stu{display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:auto minmax(0,1fr);height:calc(100dvh - 112px);min-height:460px}
.stu.gopen{grid-template-columns:minmax(0,1fr) 300px}
.tools{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:8px max(2vw,10px);border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tg{display:flex;gap:4px;flex:none;padding-right:10px;border-right:1px solid var(--line)}
.tb{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:18px;cursor:pointer;line-height:1}
.tb.wide{font-size:15px;font-weight:600;padding:0 12px;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tb.aiish{color:var(--ember)}
.sw{width:34px;height:44px;border:0;background:none;cursor:pointer;position:relative}
.sw::after{content:"";position:absolute;left:5px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sz{width:38px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true]{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ink)}
.sw[aria-pressed=true]::after{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cvwrap{position:relative;overflow:hidden;min-height:0}
.live{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
#world{will-change:transform}
.cv{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cd{contain:layout paint}
.cd .cb,.cd .cref{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;pointer-events:auto}
.cv{position:absolute;inset:0;overflow:hidden;background-color:#fbfaf6;background-image:radial-gradient(#d9d4c4 1px,transparent 1.2px);touch-action:none;cursor:crosshair;color:#1c1d21}
.cv.tool-move{cursor:grab}.cv.tool-erase{cursor:cell}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#ink{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#cards{position:absolute;left:0;top:0}
.cd{position:absolute;background:#fff;border:1px solid #e3e1da;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:15px;line-height:1.4}

.cd.on{outline:2px solid #c9411a}
.cd.k-q{background:#fff8e6;border-color:#f0dca0}.cd.k-scr{background:#f2f6ee;border-color:#cfdcc3}
.cd.ai-made{border-style:dashed}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 4px 4px 10px;font-size:12.5px;font-weight:700;color:#6b6457;cursor:grab;touch-action:none;border-bottom:1px solid rgba(0,0,0,.06);border-radius:10px 10px 0 0}
.cx{width:30px;height:30px;border:0;background:none;color:#8a8579;cursor:pointer;border-radius:6px;font-size:14px}
.cb{padding:8px 10px 10px;min-height:40px;outline:none;white-space:pre-wrap;color:#1c1d21}
.cb:empty::before{content:"Type here";color:#a39d8f}
.cref{border:0;border-bottom:1px solid #cfdcc3;border-radius:0;background:transparent;font-weight:700;padding:6px 10px;font-size:15px;color:#1c1d21}
.vv{padding:6px 10px 8px;font-size:14px;color:#2b2d31;max-height:260px;overflow:auto}
.vv sup{font-size:10px;font-weight:700;color:#6f8a5a;margin-right:2px}
.vv .note{color:#6b6457}
.bsb{font-size:11px;color:#6f8a5a;font-weight:700;margin-top:4px}
.selbar[hidden]{display:none}
.selbar{position:absolute;display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:3}
.cvhint{position:absolute;left:10px;bottom:8px;font-size:13px;color:#6b6457;pointer-events:none;max-width:calc(100% - 20px)}
.guides{overflow:auto;border-left:1px solid var(--line);padding:14px;background:var(--panel);display:none}
.stu.gopen .guides{display:block}
.glist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.glist li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 8px 8px 10px;font-size:15px}
.inkimg{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:6px;overflow:auto}
.inkimg svg{max-width:100%;height:auto;display:block}
.inkwrap{grid-column:2}
.tb svg{display:block;margin:auto}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:20}
.dlg[hidden]{display:none}
.dlgbox{background:var(--bg);color:var(--ink);border-radius:12px;padding:18px;width:min(520px,100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media(max-width:700px){.stu.gopen{grid-template-columns:minmax(0,1fr)}.stu.gopen .guides{position:fixed;left:0;right:0;bottom:0;max-height:55vh;z-index:10;border-left:0;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.15)}.stu{height:calc(100dvh - 150px)}}
@media(max-width:900px){.build{grid-template-columns:minmax(0,1fr)}.side{position:static}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.phoneIdea{display:none!important}
@media(max-width:900px){.phoneIdea{display:block!important}}
@media(max-width:600px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.seam{margin-left:14px}.stat{width:100%;margin-left:0}.top select{max-width:none;flex:1 1 100%;order:1}#seriesSel{flex:1 1 100%}.brand{flex:1 1 100%;font-size:18px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<body>
<div class="top">
  <span class="brand">Forge and Field</span>
  <select id="seriesSel" aria-label="Series filter"></select>
  <select id="lessonSel" aria-label="Lesson"></select>
  <button class="btn sm pri" id="capBtn" type="button">Capture</button>
  <button class="btn sm" id="newBtn" type="button">New lesson</button>
  <button class="btn sm" id="dupBtn" type="button">Duplicate</button>
  <button class="btn sm" id="delBtn" type="button">Delete</button>
  <span class="stat" id="stat">Loading…</span>
  <button class="btn sm" id="signOut" type="button" hidden>Sign out</button>
</div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="plan" type="button">Plan</button>
  <button role="tab" data-tab="study" type="button">Study</button>
  <button role="tab" data-tab="build" type="button">Build</button>
  <button role="tab" data-tab="teach" type="button">Teach &amp; export</button>
</nav>
<main id="main"></main>
<div class="dlg" id="capDlg" hidden><form class="dlgbox" id="capForm"><h3>Capture a thought</h3><p class="note" style="margin:0 0 8px" id="capFor"></p><div class="seg" role="group" aria-label="Kind" style="margin-bottom:10px"><button type="button" data-ck="note" aria-pressed="true">Note</button><button type="button" data-ck="q" aria-pressed="false">Question</button><button type="button" data-ck="scr" aria-pressed="false">Scripture</button></div><textarea id="capText" rows="4" placeholder="Jot it down. It lands in this lesson's Study inbox."></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button type="button" class="btn" id="capCancel">Cancel</button><button type="submit" class="btn pri">Add to inbox</button></div></form></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uid=()=>Math.random().toString(36).slice(2,10);
const KINDS=["Section","Text","Story","Explanation","Big idea","Illustration","Application","Question","Slide","Prayer"];
const TONES=[["n","Neutral"],["trouble","Trouble"],["grace","Grace"],["big","Big idea"]];
const TYPES=["Expository","Textual","Topical","Narrative","Biographical","Series","Occasional"];
const MODES=["Teach","Discuss","Solo"];
const METHODS={
 bigidea:{n:"Big Idea (Robinson)",b:[["Story","Opening","trouble"],["Text","Read the passage","n"],["Big idea","The big idea","big"],["Explanation","What does it mean?","n"],["Explanation","Is it true?","n"],["Application","What difference does it make?","grace"]]},
 fcf:{n:"Fallen Condition Focus (Chapell)",b:[["Text","Read the passage","n"],["Explanation","The need it names","trouble"],["Explanation","Grace that meets it","grace"],["Application","Response from grace","n"]]},
 plot:{n:"Homiletical Plot (Lowry)",b:[["Story","Oops: upset the balance","trouble"],["Explanation","Ugh: dig into the problem","trouble"],["Big idea","Aha: the clue","big"],["Explanation","Whee: experience the gospel","grace"],["Application","Yeah: what now","grace"]]},
 four:{n:"Four Pages (Wilson)",b:[["Section","Trouble in the Bible","trouble"],["Section","Trouble in our world","trouble"],["Section","Grace in the Bible","grace"],["Section","Grace in our world","grace"]]},
 mwgyw:{n:"Me We God You We (Stanley)",b:[["Story","Me","n"],["Explanation","We","trouble"],["Text","God","grace"],["Application","You","n"],["Application","We","grace"]]},
 inductive:{n:"Inductive (Craddock)",b:[["Question","Start with a question or story","n"],["Explanation","Wrestle with it","trouble"],["Text","Clues from the text","n"],["Big idea","Where we arrive","big"]]},
 dbs:{n:"Discovery Bible Study (group)",b:[["Question","Read it twice and retell it","n"],["Question","What does it say about God?","grace"],["Question","What does it say about people?","trouble"],["Question","What will I obey? (I will…)","n"],["Question","Who will I share it with?","n"]]},
 oia:{n:"Inductive study: O-I-A (solo)",b:[["Section","Observe","n"],["Section","Interpret","n"],["Section","Apply","n"]]}
};
const PH=[["Plan",-10,"Pick passage, type and method"],["Study",-9,"Read, observe, cross-references, open questions"],["Distill",-5,"Write the big idea and the need"],["Shape",-4,"Arrange blocks"],["Write",-3,"Fill blocks, transitions, slide markers"],["Rehearse",-1,"Read it aloud, time it, mark cues"],["Teach",0,"Teach, then export"]];

const sample=()=>{const ids=Array.from({length:8},uid);const bl=[
 {id:ids[0],kind:"Story",title:"A father's hardest decision",body:"Open with a story about a dad facing a choice that costs him something he loves. Keep it under two minutes.",tone:"trouble"},
 {id:ids[1],kind:"Text",title:"Genesis 22:1-14",body:"Read the passage aloud. Slide: Genesis 22:1-2.",tone:"n"},
 {id:ids[2],kind:"Section",title:"The test",body:"",tone:"trouble"},
 {id:ids[3],kind:"Explanation",title:"Why would God ask this?",body:"Verse 1 tells the reader up front: God tested Abraham. Abraham doesn't know that. We do. Isaac is the promise itself (21:12).",tone:"trouble"},
 {id:ids[4],kind:"Section",title:"The provision",body:"",tone:"grace"},
 {id:ids[5],kind:"Big idea",title:"God provides what He asks of us",body:"The LORD will provide (v. 14). The ram is caught in the thicket before Abraham ever sees it.",tone:"big"},
 {id:ids[6],kind:"Application",title:"What are you holding back?",body:"Name the 'Isaac' men tend to grip: career, reputation, control of our kids' future.",tone:"grace"},
 {id:ids[7],kind:"Question",title:"Where have you seen God provide?",body:"Table discussion, 5 minutes.",tone:"n"}];
 const tr={};tr[ids[0]+">"+ids[1]]="That's a hard story. Abraham's was harder. Turn with me to Genesis 22.";tr[ids[1]+">"+ids[2]]="Notice the very first line.";tr[ids[3]+">"+ids[4]]="So what does the mountain answer?";tr[ids[5]+">"+ids[6]]="If He provides, what are we still holding back?";
 const d=new Date();d.setDate(d.getDate()+(8-d.getDay())%7||7);
 return {id:"ex-"+uid(),sample:true,title:"Sample: The Lord will provide",ref:"Genesis 22:1-14",date:d.toISOString().slice(0,10),type:"Narrative",method:"bigidea",mode:"Teach",series:"Sample series: The Patriarchs",part:"3",passage:"",obs:"Repeated phrase: 'Here I am' (vv. 1, 7, 11).\nGod names Isaac as 'your only son, whom you love.'\nThree-day journey gives Abraham time to turn back.",interp:"The test reveals whether Abraham trusts the Promiser more than the promise.",app:"Trust shows up in what I'm willing to open my hands on.",xrefs:"Hebrews 11:17-19\nJohn 1:29\nRomans 8:32",qs:"Did Isaac know? How old was he?\nWhy Moriah?",subj:"What does Abraham learn on Moriah?",comp:"God provides what He asks of us.",need:"We grip the good gifts God gave us and fear letting go.",grace:"God provided the ram, and ultimately His own Son.",blocks:bl,trans:tr,done:{},updated:Date.now()}};

let L=[],cur=null,tab="build",col=null,sampler=null,dl=true,store="local",ME=null;
/* server API (replaces the artifact-only window.claude APIs) */
const api=async(method,path,body)=>{const o={method,headers:{'x-ff':'1'},credentials:'same-origin'};if(body!==undefined){o.headers['content-type']='application/json';o.body=typeof body==='string'?body:JSON.stringify(body)}const r=await fetch(path,o);let j=null;try{j=await r.json()}catch(e){}if(r.status===401&&ME){location.href='/login.html';throw {code:'signed_out'}}if(!r.ok)throw Object.assign({status:r.status,code:(j&&j.error)||'http_'+r.status,message:j&&j.message},j||{});return j};
try{const s=JSON.parse(localStorage.getItem('ff-lessons')||'[]');if(Array.isArray(s))L=s;cur=localStorage.getItem('ff-cur');const t=localStorage.getItem('ff-tab');if(t)tab=t}catch(e){}
if(!L.length)L=[sample()];
if(!L.find(l=>l.id===cur))cur=L[0].id;
const C=()=>L.find(l=>l.id===cur);

const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};
const setStat=m=>$('#stat').textContent=m;
const safeInk=s=>typeof s==='string'&&/^<svg[\s>]/.test(s)&&!/<script|\son\w+=|javascript:|<foreignObject|href=/i.test(s);

/* ---------- saving ---------- */
const dirty=new Set();let timer=null;const busy={};
const persistLocal=()=>{try{localStorage.setItem('ff-lessons',JSON.stringify(L));localStorage.setItem('ff-cur',cur);localStorage.setItem('ff-tab',tab)}catch(e){}};
const writeOne=async l=>{if(!col)return;if(busy[l.id]){busy[l.id].again=true;return}busy[l.id]={};try{await api('PUT','/api/lessons/'+encodeURIComponent(l.id),l)}catch(e){if(e&&e.code==='stale'&&e.lesson){const i=L.findIndex(x=>x.id===l.id);if(i>=0){L[i]=e.lesson;persistLocal();render();toast('This lesson was changed on another device, so that version was loaded')}}else if(e&&e.code==='too_large')toast('This lesson is too large to save.');else setStat('Saved on this device only')}const again=busy[l.id].again;delete busy[l.id];if(again)writeOne(L.find(x=>x.id===l.id)||l)};
const flush=async()=>{persistLocal();const ids=[...dirty];dirty.clear();for(const id of ids){const l=L.find(x=>x.id===id);if(l)await writeOne(l)}setStat(store==='db'?'Saved to your account':'Saved in this browser')};
const touch=()=>{const l=C();if(!l)return;l.updated=Date.now();if(l.sample)l.sample=false;dirty.add(l.id);setStat('Saving…');clearTimeout(timer);timer=setTimeout(flush,800)};

/* ---------- lesson list ---------- */
let SF="__all";try{SF=localStorage.getItem('ff-sf')||"__all"}catch(e){}
const seriesNames=()=>[...new Set(L.map(l=>(l.series||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const ord=(a,b)=>((parseFloat(a.part)||999)-(parseFloat(b.part)||999))||(a.date||'').localeCompare(b.date||'')||(a.title||'').localeCompare(b.title||'');
const inSeries=n=>L.filter(l=>(l.series||'').trim()===n).sort(ord);
const lab=l=>`${l.part?l.part+'. ':''}${esc(l.title||'Untitled')}${l.date?' · '+l.date:''}`;
const drawSel=()=>{const names=seriesNames();if(SF!=="__all"&&SF!=="__none"&&!names.includes(SF))SF="__all";
$('#seriesSel').innerHTML=`<option value="__all" ${SF==='__all'?'selected':''}>All series</option>${names.map(n=>`<option value="${esc(n)}" ${SF===n?'selected':''}>${esc(n)} (${inSeries(n).length})</option>`).join('')}<option value="__none" ${SF==='__none'?'selected':''}>No series</option>`;
const loose=L.filter(l=>!(l.series||'').trim()).sort(ord);let h='';
if(SF==='__all'){h=names.map(n=>`<optgroup label="${esc(n)}">${inSeries(n).map(l=>`<option value="${l.id}" ${l.id===cur?'selected':''}>${lab(l)}</option>`).join('')}</optgroup>`).join('')+(loose.length?`<optgroup label="No series">${loose.map(l=>`<option value="${l.id}" ${l.id===cur?'selected':''}>${lab(l)}</option>`).join('')}</optgroup>`:'')}
else{const ls=SF==='__none'?loose:inSeries(SF);h=ls.map(l=>`<option value="${l.id}" ${l.id===cur?'selected':''}>${lab(l)}</option>`).join('')||'<option value="">No lessons</option>'}
$('#lessonSel').innerHTML=h};
$('#seriesSel').addEventListener('change',e=>{SF=e.target.value;try{localStorage.setItem('ff-sf',SF)}catch(x){}const ls=SF==='__all'?L:SF==='__none'?L.filter(l=>!(l.series||'').trim()):inSeries(SF);if(ls.length&&!ls.find(l=>l.id===cur)){cur=[...ls].sort(ord)[0].id;persistLocal()}render()});
$('#lessonSel').addEventListener('change',e=>{if(!e.target.value)return;cur=e.target.value;persistLocal();render()});
const blank=()=>({id:uid(),title:"New lesson",ref:"",date:"",type:"Expository",method:"bigidea",mode:"Teach",series:"",part:"",passage:"",obs:"",interp:"",app:"",xrefs:"",qs:"",subj:"",comp:"",need:"",grace:"",blocks:[],trans:{},done:{},updated:Date.now()});
$('#newBtn').addEventListener('click',()=>{const l=blank();if(SF!=='__all'&&SF!=='__none'){l.series=SF;const ls=inSeries(SF);l.part=String((Math.max(0,...ls.map(x=>parseFloat(x.part)||0)))+1)}L.push(l);cur=l.id;tab="plan";dirty.add(l.id);flush();render()});
$('#dupBtn').addEventListener('click',()=>{const c=JSON.parse(JSON.stringify(C()));c.id=uid();c.title+=" (copy)";c.sample=false;L.push(c);cur=c.id;dirty.add(c.id);flush();render();toast('Duplicated')});
let delArm=0;
$('#delBtn').addEventListener('click',async e=>{if(Date.now()-delArm>3000){delArm=Date.now();e.target.textContent='Tap again to delete';setTimeout(()=>e.target.textContent='Delete',3000);return}e.target.textContent='Delete';const id=cur;L=L.filter(l=>l.id!==id);if(col){try{await api('DELETE','/api/lessons/'+encodeURIComponent(id))}catch(x){}}try{localStorage.removeItem(cvKey(id))}catch(x){}if(!L.length)L=[blank()];cur=L[0].id;dirty.add(cur);flush();render();toast('Lesson deleted')});

/* ---------- tabs ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;persistLocal();render()});

/* ---------- views ---------- */
const opt=(arr,v)=>arr.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`}).join('');
const fld=(k,lab,type='input',ph='',rows=3)=>{const l=C();return `<div class="f"><label for="f-${k}">${lab}</label>${type==='input'?`<input id="f-${k}" data-f="${k}" value="${esc(l[k])}" placeholder="${esc(ph)}">`:type==='date'?`<input type="date" id="f-${k}" data-f="${k}" value="${esc(l[k])}">`:`<textarea id="f-${k}" data-f="${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(l[k])}</textarea>`}</div>`};
const sel=(k,lab,opts)=>`<div class="f"><label for="f-${k}">${lab}</label><select id="f-${k}" data-f="${k}">${opt(opts,C()[k])}</select></div>`;

const vPlan=()=>{const l=C();const ph=l.date?PH.map(p=>{const d=new Date(l.date+'T12:00');d.setDate(d.getDate()+p[1]);const ds=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});const past=d<new Date(new Date().toDateString());return `<li class="${past&&!l.done[p[0]]?'past':''}"><input type="checkbox" id="ph-${p[0]}" data-ph="${p[0]}" ${l.done[p[0]]?'checked':''} aria-label="${p[0]} done"><span class="d">${ds}</span><span><b>${p[0]}</b> · ${p[2]}</span></li>`}).join(''):'';
return `<div class="g2"><div>
<h2>Plan the lesson</h2>
${fld('title','Title')}
<div class="g2">${fld('ref','Passage','input','e.g. Genesis 22:1-14')}${fld('date','Teach date','date')}</div>
<div class="g2" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)"><div class="f"><label for="f-series">Series</label><input id="f-series" data-f="series" list="seriesList" value="${esc(l.series)}" placeholder="e.g. One Story"><datalist id="seriesList">${seriesNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><div class="f"><label for="f-part">Part #</label><input id="f-part" data-f="part" inputmode="decimal" value="${esc(l.part)}" placeholder="1"></div></div>
<div class="g3">${sel('type','Sermon type',TYPES)}${sel('mode','Mode',MODES)}${sel('method','Method',Object.entries(METHODS).map(([k,v])=>[k,v.n]))}</div>
<div class="card"><h3>Load the method's blocks</h3><p class="note">Adds the ${esc(METHODS[l.method].n)} blocks to Build. You can rename, reorder or delete them after.</p><div class="row"><button class="btn" id="tplAdd" type="button">Add to end</button><button class="btn" id="tplRep" type="button">Replace all blocks</button></div></div>
</div><div>
${(l.series||'').trim()?(()=>{const ls=inSeries(l.series.trim());return `<div class="card" style="margin-bottom:18px"><h3>${esc(l.series)}</h3><p class="note" style="margin:0">${ls.length} lesson${ls.length===1?'':'s'} in this series. Tap one to open it.</p><ul class="slist">${ls.map(x=>`<li><button type="button" data-open="${x.id}" aria-current="${x.id===cur}"><span class="pn">${esc(x.part||'–')}</span><span><b>${esc(x.title||'Untitled')}</b>${x.ref?`<br><span class="note">${esc(x.ref)}</span>`:''}</span><span class="dt">${esc(x.date||'')}</span></button></li>`).join('')}</ul><div class="row"><button class="btn" type="button" id="newInSeries">New lesson in this series</button><button class="btn" type="button" data-dl="series">Download series outline</button></div></div>`})():''}
<h2>Prep cycle</h2>
${l.date?`<ul class="phases">${ph}</ul><p class="note">Dates count back from the teach date. Tick each phase as you finish it.</p>`:`<div class="empty">Set a teach date to lay out the prep cycle.</div>`}
</div></div>`};

let SUG=null;
const suggHtml=()=>{if(!SUG)return '';const it=[];(SUG.observations||[]).forEach(x=>it.push(['obs','Observation',x]));(SUG.keywords||[]).forEach(x=>it.push(['obs','Key word',`${x.word}: ${x.note}`]));(SUG.crossrefs||[]).forEach(x=>it.push(['xrefs','Cross-reference',`${x.ref} (${x.why})`]));(SUG.questions||[]).forEach(x=>it.push(['qs','Question',x]));return it.map((x,i)=>`<div class="sg"><span><b>${x[1]}:</b> ${esc(x[2])}</span><button class="btn sm" data-add="${i}" type="button">Add</button></div>`).join('');};

const range=i=>{const b=C().blocks;if(b[i].kind!=='Section')return [i,i+1];let j=i+1;while(j<b.length&&b[j].kind!=='Section')j++;return [i,j]};
const words=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const stats=()=>{const l=C();let t=0,g=0,w=0,open=0;l.blocks.forEach((b,i)=>{const n=Math.max(words(b.body),15);if(b.tone==='trouble')t+=n;if(b.tone==='grace'||b.tone==='big')g+=n;w+=words(b.title)+words(b.body);if(i<l.blocks.length-1){const v=l.trans[b.id+'>'+l.blocks[i+1].id];if(!v||!v.trim())open++;else w+=words(v)}});return {t,g,w,open,min:Math.round(w/130)}};
const vBuild=()=>{const l=C(),s=stats();const tot=s.t+s.g||1;
const list=l.blocks.length?l.blocks.map((b,i)=>{let h=`<div class="blk ${b.kind==='Section'?'sec ':''}${b.tone}" data-i="${i}"><button class="grip" type="button" data-g="${i}" aria-label="Drag ${esc(b.title||b.kind)}${b.kind==='Section'?' and its blocks':''}">⋮⋮</button>
<div class="bh"><select data-b="${b.id}" data-bf="kind" aria-label="Block kind">${opt(KINDS,b.kind)}</select><select data-b="${b.id}" data-bf="tone" aria-label="Tone">${opt(TONES,b.tone)}</select><span class="sp"></span><button class="ib" type="button" data-up="${i}" aria-label="Move up" ${i?'':'disabled'}>↑</button><button class="ib" type="button" data-dn="${i}" aria-label="Move down" ${range(i)[1]<l.blocks.length?'':'disabled'}>↓</button><button class="ib" type="button" data-ins="${i}" aria-label="Add block below">+</button><button class="ib" type="button" data-del="${i}" aria-label="Delete block">✕</button></div>
<input class="bt" data-b="${b.id}" data-bf="title" value="${esc(b.title)}" placeholder="${b.kind==='Section'?'Section heading':'Block title'}" aria-label="Title">
${b.kind==='Section'?'':`<textarea data-b="${b.id}" data-bf="body" rows="3" placeholder="Write this block…" aria-label="Body">${esc(b.body)}</textarea>`}${safeInk(b.ink)?`<div class="inkwrap"><div class="inkimg">${b.ink}</div><div class="row" style="margin-top:6px"><button class="btn sm ai" type="button" data-read="${b.id}">Read handwriting</button><button class="btn sm" type="button" data-dropink="${b.id}">Remove ink</button></div></div>`:''}</div>`;
if(i<l.blocks.length-1){const k=b.id+'>'+l.blocks[i+1].id,v=l.trans[k]||'';h+=`<div class="seam ${v.trim()?'':'open'}" data-seam="${k}"><div class="lab"><span>${v.trim()?'Transition':'New seam: needs a transition'}</span><button class="btn sm ai" type="button" data-ait="${k}">Draft</button></div><textarea data-t="${k}" rows="1" aria-label="Transition" placeholder="From ${esc(b.title||b.kind)} to ${esc(l.blocks[i+1].title||l.blocks[i+1].kind)}">${esc(v)}</textarea></div>`}return h}).join(''):`<div class="empty">No blocks yet. Add one below, or load a method's blocks from Plan.</div>`;
return `<div class="build"><div>
<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">${esc(l.title)}</h2>${l.comp?`<p class="note phoneIdea" style="width:100%;margin:0">Big idea: <b>${esc(l.comp)}</b> (edit below the blocks)</p>`:''}<span class="note">${l.blocks.length} blocks · about ${s.min} min</span></div>
<div id="blocks" style="display:grid;gap:8px">${list}</div>
<div class="row" style="margin-top:14px"><button class="btn" type="button" id="addBlk">Add block</button><button class="btn" type="button" id="addSec">Add section</button><button class="btn" type="button" id="nextSeam" ${s.open?'':'disabled'}>Review next seam (${s.open})</button></div>
</div><aside class="side">
<div class="card"><h3>Big idea</h3>
<div class="f"><label for="f-subj">Subject: what is it talking about?</label><input id="f-subj" data-f="subj" value="${esc(l.subj)}"></div>
<div class="f"><label for="f-comp">Complement: what is it saying about that?</label><input id="f-comp" data-f="comp" value="${esc(l.comp)}"></div>
<div class="idea" id="ideaOut">${esc(l.comp||'Your big idea appears here.')}</div>
<div class="row" style="margin-top:10px"><button class="btn sm ai" id="aiIdea" type="button">Check it</button></div><div id="ideaFb" class="note" style="margin-top:8px"></div></div>
<div class="card"><h3>Need and grace</h3>
<div class="f"><label for="f-need">The need it names</label><textarea id="f-need" data-f="need" rows="2">${esc(l.need)}</textarea></div>
<div class="f"><label for="f-grace">The grace that meets it</label><textarea id="f-grace" data-f="grace" rows="2">${esc(l.grace)}</textarea></div>
<div class="meter" aria-label="Trouble and grace balance"><i style="width:${s.t/tot*100}%;background:var(--tr)"></i><i style="width:${s.g/tot*100}%;background:var(--gr)"></i></div>
<div class="kv"><span>Trouble ${Math.round(s.t/tot*100)}%</span><span>Grace ${Math.round(s.g/tot*100)}%</span></div>
<p class="note" style="margin:8px 0 0">Based on each block's tone and length. Set tone on each block.</p></div>
<div class="card"><h3>Discussion questions</h3><p class="note">Adds question blocks drawn from your big idea and passage.</p><button class="btn sm ai" id="aiQs" type="button">Suggest 3 questions</button></div>
</aside></div>`};

let FMT="manuscript",INC=true;
const exportMd=()=>{const l=C();let o=`# ${l.title}\n\n${l.ref?`**Passage:** ${l.ref}  \n`:''}${l.date?`**Date:** ${l.date}  \n`:''}**Mode:** ${l.mode}\n\n`;if(l.comp)o+=`> **Big idea:** ${l.comp}\n\n`;
l.blocks.forEach((b,i)=>{if(b.kind==='Section')o+=`## ${b.title}\n\n`;else if(FMT==='card')o+=`- ${b.kind==='Big idea'?'**'+b.title+'**':b.title}\n`;else if(FMT==='outline'){const first=(b.body||'').split(/(?<=[.?!])\s/)[0];o+=`- **${b.title||b.kind}**${first?': '+first:''}\n`}else o+=`### ${b.title||b.kind}\n\n${b.body?b.body+'\n\n':''}`;
if(INC&&FMT!=='card'&&i<l.blocks.length-1){const v=l.trans[b.id+'>'+l.blocks[i+1].id];if(v&&v.trim())o+=FMT==='outline'?`  - _→ ${v.trim()}_\n`:`_→ ${v.trim()}_\n\n`}});return o.trim()+"\n"};
const exportHtml=()=>{const l=C();let b='';l.blocks.forEach((x,i)=>{if(x.kind==='Section')b+=`<h2>${esc(x.title)}</h2>`;else if(FMT==='card')b+=`<li>${x.kind==='Big idea'?'<b>'+esc(x.title)+'</b>':esc(x.title)}</li>`;else if(FMT==='outline'){const f=(x.body||'').split(/(?<=[.?!])\s/)[0];b+=`<li><b>${esc(x.title||x.kind)}</b>${f?': '+esc(f):''}</li>`}else b+=`<h3>${esc(x.title||x.kind)}</h3>${x.kind==='Big idea'?`<p class="bi">${esc(x.body||x.title)}</p>`:(x.body||'').split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}${safeInk(x.ink)?`<div class="inkimg">${x.ink}</div>`:''}`;
if(INC&&FMT!=='card'&&i<l.blocks.length-1){const v=l.trans[x.id+'>'+l.blocks[i+1].id];if(v&&v.trim())b+=FMT==='outline'?`<li class="t">${esc(v)}</li>`:`<p class="t">${esc(v)}</p>`}});
if(FMT!=='manuscript')b=b.replace(/(<li[\s\S]*?<\/li>)(?=<h2|$)/g,'<ul>$1</ul>');
return {body:`<h1>${esc(l.title)}</h1><p style="color:#5b5d63">${esc([l.ref,l.date,l.mode].filter(Boolean).join(' · '))}</p>${l.comp?`<p class="bi">${esc(l.comp)}</p>`:''}${b}`,title:l.title}};
const fullHtml=()=>{const h=exportHtml();return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(h.title)}</title><style>body{font:17px/1.6 Georgia,serif;color:#1c1d21;max-width:720px;margin:40px auto;padding:0 20px}h1,h2,h3{font-family:Arial,sans-serif;line-height:1.15}h1{font-size:30px;margin-bottom:4px}h2{font-size:22px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:4px}h3{font-size:17px;margin:20px 0 4px}.t{color:#6a4a3a;font-style:italic;border-left:3px solid #e09474;padding-left:10px}.bi{font-family:Arial,sans-serif;font-size:19px;font-weight:700;border-left:4px solid #c9411a;padding-left:10px}@media print{body{margin:0}}</style></head><body>${h.body}</body></html>`};
const fname=ext=>(C().title||'lesson').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)+'.'+ext;
const vTeach=()=>{const l=C(),s=stats();return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Teach &amp; export</h2><span class="note">${s.w} words · about ${s.min} min at 130 words a minute${s.open?` · ${s.open} seam${s.open>1?'s':''} still open`:''}</span></div>
<div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Format">${[["manuscript","Manuscript"],["outline","Outline"],["card","Note card"]].map(f=>`<button type="button" data-fmt="${f[0]}" aria-pressed="${FMT===f[0]}">${f[1]}</button>`).join('')}</div>
<label style="display:flex;gap:8px;align-items:center;margin:0 8px;color:var(--ink)"><input type="checkbox" id="incT" style="width:20px;height:20px" ${INC?'checked':''}> Include transitions</label></div>
<div class="prev" id="prev">${exportHtml().body}</div>
<div class="row" style="margin-top:14px"><button class="btn pri" type="button" data-dl="html">Download HTML</button><button class="btn" type="button" data-dl="md">Download Markdown</button><button class="btn" type="button" id="copyTxt">Copy text</button><button class="btn" type="button" data-dl="json">Back up all lessons</button><label class="btn" style="display:inline-flex;align-items:center;margin:0;color:var(--ink);font-size:16px" for="imp">Restore backup</label><input type="file" id="imp" accept=".json,application/json" style="display:none"></div>
<p class="note">For PDF, open the downloaded HTML and print to PDF. Downloads go wherever your device saves files; from there, move them into Box.</p>`};

const render=()=>{drawSel();document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));flushNow();$('#main').classList.toggle('wide',tab==='study');$('#main').innerHTML=tab==='plan'?vPlan():tab==='study'?vStudy():tab==='build'?vBuild():vTeach();sizeAll();if(tab==='study')initCanvas();else{cvEl=null;cv=null}};
const size=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};
const sizeAll=()=>document.querySelectorAll('main textarea').forEach(size);
const softBuild=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};

/* ---------- input binding ---------- */
$('#main').addEventListener('input',e=>{const t=e.target,l=C();if(t.tagName==='TEXTAREA')size(t);
if(t.dataset.f){l[t.dataset.f]=t.value;if(t.dataset.f==='comp'){const o=$('#ideaOut');if(o)o.textContent=t.value||'Your big idea appears here.'}if(t.dataset.f==='title')drawSel();touch();return}
if(t.dataset.b){const b=l.blocks.find(x=>x.id===t.dataset.b);if(b){b[t.dataset.bf]=t.value;touch();if(t.dataset.bf==='kind'||t.dataset.bf==='tone'){if(t.dataset.bf==='kind'&&t.value==='Big idea')b.tone='big';softBuild()}}return}
if(t.dataset.t!==undefined){l.trans[t.dataset.t]=t.value;const w=t.closest('.seam'),has=!!t.value.trim();w.classList.toggle('open',!has);w.querySelector('.lab span').textContent=has?'Transition':'New seam: needs a transition';touch();return}
if(t.dataset.ph){l.done[t.dataset.ph]=t.checked;touch();return}
if(t.id==='incT'){INC=t.checked;$('#prev').innerHTML=exportHtml().body}});
$('#main').addEventListener('change',e=>{const t=e.target;if(t.dataset.f&&(t.tagName==='SELECT'||t.type==='date'||t.dataset.f==='series'||t.dataset.f==='part')&&tab==='plan')softBuild();if(t.id==='imp'&&t.files[0])importFile(t.files[0])});

/* ---------- block moves ---------- */
const move=(s,e,t)=>{const b=C().blocks;const it=b.splice(s,e-s);b.splice(t,0,...it);touch();softBuild()};
let tplArm=0;
$('#main').addEventListener('click',async e=>{const t=e.target.closest('button');if(!t||t.closest('.stu'))return;const l=C(),b=l.blocks;
if(t.dataset.read){readInk(t);return}

const aiData=(extra)=>{const l=C();return Object.assign({title:l.title||'',ref:l.ref||'',mode:l.mode||'',subj:l.subj||'',comp:l.comp||'',need:l.need||'',grace:l.grace||'',passage:(l.passage||'').slice(0,8000)},extra||{})};
const task=async(name,extra)=>{if(!sampler)throw {message:ME?'AI is not set up on this server yet.':'AI needs the server. Sign in to use it.'};const r=await api('POST','/api/ai/'+name,aiData(extra));return r.data!==undefined?r.data:r.text};
const cut=(b)=>({kind:b.kind||'',title:(b.title||'').slice(0,400),body:(b.body||'').slice(0,4000)});
const ctx=()=>{const l=C();return `Lesson: "${l.title}". Passage: ${l.ref||'none'}. Mode: ${l.mode} (Teach = men's group teaching, Discuss = small-group discussion, Solo = personal study). Big idea: ${l.comp||'not set'}.`};
async function runAI(btn){const l=C(),lab=btn.textContent;btn.disabled=true;btn.textContent='Working…';
try{
if(btn.id==='aiStudy'){SUG=await task('study');$('#sugg').innerHTML=suggHtml()}
else if(btn.id==='aiIdea'){if(!l.subj&&!l.comp){toast('Write a subject and complement first');return}const r=await task('idea');$('#ideaFb').innerHTML=`${esc(r.verdict)}<br><b>Try:</b> ${esc(r.suggestion)}`}
else if(btn.id==='aiQs'){const r=await task('questions');(r.questions||[]).slice(0,3).forEach(q=>l.blocks.push({id:uid(),kind:"Question",title:q,body:"",tone:"n"}));touch();softBuild();toast('Questions added at the end')}
else if(btn.dataset.ait){const [a,b]=btn.dataset.ait.split('>').map(id=>l.blocks.find(x=>x.id===id));const tx=await task('transition',{a:cut(a),b:cut(b)});l.trans[btn.dataset.ait]=tx.trim().replace(/^"|"$/g,'');touch();softBuild()}
}catch(x){toast((x&&x.message)||'That did not work. Try again.')}
finally{if(btn.isConnected){btn.disabled=false;btn.textContent=lab}}}
